models:
  - type: main
    engine: huggingface_hub
    model: microsoft/Phi-3-mini-4k-instruct
    parameters:
      repo_id: "microsoft/Phi-3-mini-4k-instruct"

  - type: patronus_lynx
    engine: vllm_openai
    parameters:
      openai_api_base: "http://localhost:5000/v1"
      model_name: "PatronusAI/Patronus-Lynx-8B-Instruct" # "PatronusAI/Patronus-Lynx-8B-Instruct"

rails:
  output:
    flows:
      - patronus lynx check output hallucination